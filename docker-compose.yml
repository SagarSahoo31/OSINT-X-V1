services:
  postgres:
    image: postgres:16-alpine
    container_name: osintx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osintx}
      POSTGRES_USER: ${POSTGRES_USER:-osintx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osintx_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osintx_user} -d ${POSTGRES_DB:-osintx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: osintx-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: osintx-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # HTTP Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-osintx_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-osintx_neo4j_password} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: osintx-backend:latest
    container_name: osintx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-osintx_user}:${POSTGRES_PASSWORD:-osintx_secure_password}@postgres:5432/${POSTGRES_DB:-osintx}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-osintx_user}:${POSTGRES_PASSWORD:-osintx_secure_password}@postgres:5432/${POSTGRES_DB:-osintx}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-osintx_neo4j_password}
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    image: osintx-backend:latest
    container_name: osintx-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-osintx_user}:${POSTGRES_PASSWORD:-osintx_secure_password}@postgres:5432/${POSTGRES_DB:-osintx}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-osintx_user}:${POSTGRES_PASSWORD:-osintx_secure_password}@postgres:5432/${POSTGRES_DB:-osintx}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-osintx_neo4j_password}
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: osintx-frontend:latest
    container_name: osintx-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-8000}

  ollama:
    image: ollama/ollama:latest
    container_name: osintx-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollamadata:/root/.ollama
    profiles:
      - ai

volumes:
  pgdata:
  redisdata:
  neo4jdata:
  ollamadata:
